name: Supabase Keep-Alive

on:
  schedule:
    # Harian 00:00 UTC, cukup untuk mencegah pause karena 7 hari inactivity.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Gunakan RPC get_link_by_code (grant EXECUTE ke anon, SECURITY DEFINER).
          # Query tabel links langsung tidak dipakai karena hak anon ke tabel
          # sudah dicabut untuk mencegah enumerasi.
          curl -fsS -X POST \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"__keepalive__"}' \
            "${SUPABASE_URL}/rest/v1/rpc/get_link_by_code" \
            -o /dev/null
          echo "Supabase pinged successfully."