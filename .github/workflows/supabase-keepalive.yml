name: Supabase Keep-Alive

on:
  schedule:
    # Daily 00:00 UTC, enough to prevent pausing due to 7 days of inactivity.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Use the get_link_by_code RPC (EXECUTE granted to anon, SECURITY DEFINER).
          # A direct query on the links table is not used because anon access
          # to the table was revoked to prevent enumeration.
          curl -fsS -X POST \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"__keepalive__"}' \
            "${SUPABASE_URL}/rest/v1/rpc/get_link_by_code" \
            -o /dev/null
          echo "Supabase pinged successfully."