<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shortic Admin — Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <button id="theme-toggle" class="theme-toggle-fixed" title="Ganti mode terang/malam" aria-label="Ganti mode terang/malam">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
  </button>

  <main class="auth-card">
    <svg class="auth-logo" viewBox="0 0 300 122" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="shortic">
      <defs>
        <linearGradient id="shortic-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#8b5cf6" />
          <stop offset="100%" stop-color="#22d3ee" />
        </linearGradient>
      </defs>
      <g fill="url(#shortic-grad)">
        <text x="4" y="68" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" transform="rotate(-7 4 68)">s</text>
        <text x="40" y="76" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" transform="rotate(5 40 76)">h</text>
        <text x="78" y="64" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" transform="rotate(-3 78 64)">o</text>
        <text x="116" y="70" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" transform="rotate(4 116 70)">r</text>
        <text x="150" y="78" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" transform="rotate(-2 150 78)">t</text>
        <text x="184" y="62" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" transform="rotate(7 184 62)">i</text>
        <text x="218" y="72" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" transform="rotate(-6 218 72)">c</text>
      </g>
      <g>
        <circle cx="92" cy="40" r="3.2" fill="#0f172a" />
        <circle cx="105" cy="40" r="3.2" fill="#0f172a" />
        <path d="M90 48 Q 98.5 54 107 48" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
      </g>
      <path d="M12 94 Q 150 116 280 92" fill="none" stroke="url(#shortic-grad)" stroke-width="5" stroke-linecap="round" />
      <path d="M272 8 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#f59e0b" />
    </svg>

    <button id="login-btn" class="btn btn-block">Login dengan Google</button>
    <p id="login-msg" class="msg hidden"></p>
  </main>

  <div id="toast" class="toast-fixed"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="auth.js"></script>
</body>
</html>
